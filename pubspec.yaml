name: dyooni
description: >
  تطبيق تسجيل وإدارة الديون بالصوت والنص — Hybrid architecture, Riverpod state management.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (Step 2 decision: Riverpod)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Local persistence (onboarding "seen" flag now; full DB from Phase 1 onward)
  shared_preferences: ^2.2.3

  # Cloud backend (confirmed decision): Firebase Auth (email/password + Google/Facebook) +
  # Firestore for cloud-synced debt records. Pinned exact (not ^) — auth SDKs are security-
  # sensitive per quality-baseline.md §4, so a version bump here should be a deliberate, reviewed
  # change.
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.4

  # Google Sign-In (used both for Firebase Auth's Google provider AND for requesting Drive scope
  # in the same consent flow — one sign-in, two purposes, see auth screen design notes)
  google_sign_in: ^6.2.1

  # Google Drive backup/restore (Section 3.9 — "حفظ واسترجاع / مزامنة البيانات على جوجل درايف")
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Facebook Sign-In (replaces the earlier Apple option per the current design decision)
  flutter_facebook_auth: ^7.1.1

  # Logging (avoid_print lint — see patterns.md §5)
  logger: ^2.4.0

  # Local ID generation for the accounts feature (Phase 1)
  uuid: ^4.5.1

  # Reports export (this batch): real PDF generation + native print/share sheet, and sharing the
  # CSV report file. NOTE: deliberately CSV, not a true .xlsx binary — the `excel` package's API
  # has changed across major versions and I can't verify the exact installed API from this
  # sandbox (no network); CSV has zero such risk (it's just UTF-8 text) and opens natively in
  # Excel/Sheets, so it's the safer choice for something that must compile correctly on the first
  # try. See README "التصدير" for the one dependency here that genuinely needs your confirmation.
  pdf: ^3.11.1
  printing: ^5.13.4
  # Pinned to the 7.x line deliberately — share_plus 9/10 introduced a newer instance-based
  # `SharePlus.instance.share(ShareParams(...))` API and I can't verify from this sandbox whether
  # the older static `Share.shareXFiles(...)` still works unchanged on it. 7.x's API has been
  # stable for a long time, so this is the lower-risk choice for something that must compile
  # correctly on the first try.
  share_plus: ^11.0.1
  path_provider: ^2.1.4

  # Lets the person pick an existing file from their device (the local backup screen's
  # "استعادة من ملف" / restore-from-file flow, to choose a previously exported .dyoonibackup
  # file). Like arabic_reshaper, I could not verify this exact version against a live pub.dev
  # listing from this offline sandbox — it is a long-established, extremely widely-used package
  # for exactly this purpose, but please run `flutter pub get` and tell me immediately if it
  # fails to resolve so I can pin a different version.
  file_picker: ^10.3.10

  # NEW this batch — AES encryption for local backup files, so a `.dyoonibackup` file is opaque
  # cipher bytes to anyone who opens it without the password (see core/utils/backup_crypto.dart).
  # A long-established, widely-used, stable package for exactly this — same verification caveat
  # as file_picker/arabic_reshaper above applies (no live pub.dev access from this sandbox).
  encrypt: ^5.0.3

  # Voice input: native STT for short commands, original local recordings,
  # and their in-app playback. Versions are constrained to the app's Dart 3.4 SDK.
  speech_to_text: ^7.4.0
  record: ^6.0.0
  just_audio: ^0.9.46

  # Arabic letter shaping for the PDF — the `pdf` package has no text-shaping engine of its own,
  # so Arabic names/labels would render as disconnected letters without this. This is the one
  # dependency in this whole project I could NOT verify against a real pub.dev listing from this
  # sandbox (no network access) — it's a well-known community solution for this exact problem,
  # but please run `flutter pub get` and tell me immediately if this specific package fails to
  # resolve; I have a fallback ready (see core/utils/arabic_pdf_text.dart).
  arabic_reshaper: ^0.0.1

  # Real device photo picking for the stamp image (Personal Data screen, "اختيار الختم") —
  # Google's official Flutter Favorite plugin. On Android 13+ it uses the system Photo Picker,
  # which needs NO runtime storage permission at all; on older Android it falls back to a
  # permission request the plugin handles itself. On iOS it needs
  # `NSPhotoLibraryUsageDescription` added to ios/Runner/Info.plist — please add that key before
  # testing on iOS (I don't have that file in this sandbox to add it for you).
  image_picker: ^1.1.2

  # NEW this batch — opens the device's OWN native contact-picker UI (`openExternalPick`) so a
  # person can fill an account's name/phone from an existing contact. Deliberately the EXTERNAL
  # picker, not an in-app contact list built on `FlutterContacts.getContacts()`: the external
  # picker hands back exactly the one contact the person chose via the OS's own one-time grant,
  # so it needs NO `READ_CONTACTS` runtime permission and NO manifest/Info.plist entry at all —
  # the OS contact-picker app is what actually reads the contacts database, not this app.
  flutter_contacts: ^1.1.9+2

  # NEW this batch — opens the device's phone dialer (`tel:` URI) from the account's call icon.
  url_launcher: ^6.3.1

  # NEW this batch, promoted from a transitive dependency (was already resolved at 4.9.1 via
  # image_picker/pdf) to a DIRECT one — now imported directly to rotate a transaction's attached
  # photo in place.
  image: ^4.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true # enables flutter gen-l10n from core/l10n ARB files, see l10n.yaml

  assets:
    - assets/images/
    - assets/icons/

  # Real font files confirmed present — bundled directly, no more google_fonts runtime fetch.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

# App launcher icon — generates all platform icon sizes from a DEDICATED icon file
# (assets/icons/app_icon.png), deliberately separate from assets/icons/app_logo.png (the mark
# shown INSIDE the app's own screens — AppLogo widget, onboarding, drawer header, PDF report
# header). The two have different design constraints (a launcher icon is square with safe-zone
# padding for adaptive-icon masking; the in-app logo can be any shape/aspect on a matching
# background), so sharing one file was always the wrong long-term choice even though it worked
# visually before. Add BOTH files under assets/icons/ — `app_icon.png` for this config,
# `app_logo.png` for everywhere else — then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  background_color_ios: "#0C1A2B"
  adaptive_icon_background: "#061A3A"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
